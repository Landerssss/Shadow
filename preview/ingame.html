<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>暗影回响 · 局内预览</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #07030f; }
  iframe { display: block; width: 100vw; height: 100vh; border: 0; }
  #hint {
    position: fixed; left: 10px; bottom: 8px; z-index: 10;
    color: #9d8bbd; font: 12px "Noto Sans SC", sans-serif;
    pointer-events: none; text-shadow: 0 1px 2px #000;
  }
</style>
</head>
<body>
  <iframe id="game" src="../index.html"></iframe>
  <div id="hint"></div>
<script>
(function(){
  const params = new URLSearchParams(location.search);
  const genre = Math.max(0, Math.min(4, parseInt(params.get('genre') || '0', 10) || 0));
  const frame = document.getElementById('game');
  const hint = document.getElementById('hint');
  hint.textContent = '局内预览 · 流派 ID ' + genre + '（自动开始，等 4 秒后截图）';
  frame.addEventListener('load', function () {
    setTimeout(function(){
      try {
        const w = frame.contentWindow;
        // 游戏脚本中的 Game 是全局词法绑定，通过同源 eval 触发自动开始
        w.eval('Game.selectGenre(' + genre + ')');
        hint.textContent = '局内预览 · 流派 ID ' + genre + '（已自动开始）';
      } catch (e) {
        hint.textContent = '自动开始失败：' + e.message;
      }
    }, 500);
  });
})();
</script>
</body>
</html>
